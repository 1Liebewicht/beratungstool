<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beratungstool – Swipe-Testversion</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.topbar{height:64px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;padding:0 24px;font-weight:700}.container{max-width:1080px;margin:auto;padding:35px 20px 70px}.hero{text-align:center;max-width:760px;margin:35px auto}.eyebrow{color:#6875d8;font-weight:700;text-transform:uppercase;font-size:.8rem}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:15px 0}.hero p,.muted{color:#687181}.button{border:0;border-radius:12px;padding:13px 19px;font:inherit;font-weight:700;cursor:pointer;background:#172033;color:#fff}.button.secondary{background:#eef1f7;color:#24304a}.actions,.footer{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:25px}.actions{justify-content:center}.panel{background:#fff;border:1px solid #e5e9f0;border-radius:20px;padding:25px;box-shadow:0 12px 35px #25365c0d}.notice{margin-top:28px;color:#3d4b8d;background:#f1f4ff;border-radius:14px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.category{text-align:left;min-height:150px;cursor:pointer}.number,.code{color:#6875d8;font-weight:700}.progress{height:8px;background:#e7eaf1;border-radius:99px;margin:18px 0 24px}.progress span{display:block;height:100%;background:#6875d8;border-radius:99px}.swipe-stage{max-width:620px;margin:0 auto}.swipe-card{position:relative;min-height:460px;padding:30px 26px;display:flex;flex-direction:column;justify-content:space-between;touch-action:none;user-select:none;cursor:grab;transition:transform .22s ease,opacity .22s ease}.swipe-card.dragging{cursor:grabbing;transition:none}.swipe-card.fly-left{transform:translateX(-130%) rotate(-18deg);opacity:0}.swipe-card.fly-right{transform:translateX(130%) rotate(18deg);opacity:0}.swipe-label{position:absolute;top:30px;padding:7px 12px;border:3px solid;border-radius:9px;font-weight:800;opacity:0;transition:opacity .1s}.swipe-label.left{left:25px;color:#a32626;border-color:#a32626}.swipe-label.right{right:25px;color:#176b37;border-color:#176b37}.swipe-card.left .swipe-label.left,.swipe-card.right .swipe-label.right{opacity:1}.swipe-card h2{font-size:clamp(1.6rem,4vw,2.6rem);margin:15px 0}.swipe-info{font-size:.95rem}.swipe-actions{display:flex;justify-content:center;gap:14px;margin-top:20px}.round{width:54px;height:54px;border-radius:50%;border:0;font-size:1.5rem;font-weight:800;cursor:pointer}.round.left{background:#ffecec;color:#a32626}.round.right{background:#eaf8ef;color:#176b37}.round.neutral{background:#eef1f7;color:#34405a}.questions{margin:20px 0;border-top:1px solid #e5e9f0;padding-top:15px}.questions summary,.result summary{cursor:pointer;font-weight:700}.questions li,.question-list li{margin:9px 0}.sort-help{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.help{padding:12px;border-radius:12px;font-size:.88rem}.help.left{background:#fff0f0;color:#8b2727}.help.right{background:#eef9f1;color:#176b37}.result{background:#f7f8fb;border-radius:10px;padding:11px;margin:7px 0}.result details{margin-top:10px;border-top:1px solid #e1e5ed;padding-top:9px}.count{background:#eef1f7;border-radius:99px;padding:4px 10px;font-size:.85rem}.result-section{margin:28px 0}.highlight{border-left:5px solid #6875d8}.forms{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}textarea{width:100%;min-height:190px;border:1px solid #d9deea;border-radius:14px;padding:14px;font:inherit;resize:vertical}label{font-weight:700;display:block;margin-bottom:8px}.export-note{padding:14px;background:#f0faf3;border-radius:12px;color:#176b37;margin-top:18px}.priority-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.dropzone{min-height:140px;border:2px dashed #cbd2e1;border-radius:16px;padding:15px;background:#fafbfe}.dropzone.exclude{background:#fff8f5;border-color:#e8c9bc}.dropzone.over{background:#eef4ff;border-color:#6875d8}.drag-card{background:#fff;border:1px solid #dfe4ed;border-radius:12px;padding:12px;margin:8px 0;cursor:grab}.rank{display:inline-flex;width:27px;height:27px;border-radius:50%;background:#eef1f7;align-items:center;justify-content:center;margin-right:8px;font-size:.85rem;font-weight:700}.priority-list{padding:0;margin:0;list-style:none}.priority-list li{padding:9px 0;border-bottom:1px solid #edf0f5}@media(max-width:700px){.container{padding:25px 15px 60px}.topbar{padding:0 15px}.forms,.priority-layout,.sort-help{grid-template-columns:1fr}.swipe-card{min-height:480px}}
@media print{.topbar,.no-print{display:none!important}.container{padding:0;max-width:none}.panel{box-shadow:none;border:0;padding:0}}
</style>
</head>
<body><header class="topbar">Beratungstool · Swipe-Testversion</header><main id="app" class="container"></main>
<script>
(function(){'use strict';
const categories=['Schulisches Zukunftsbild','Persönlichkeitsentwicklung und Lebenswelt der Schüler:innen','Gestaltung schulischer Lehr-/Lernprozesse','Veränderte Rollen und kontinuierliche Professionalisierung von Lehrkräften','Einbezug digitaler Ausstattung'];
const cards=[
{id:'EF1-1',cat:0,title:'Partizipative Entwicklung unseres Zukunftsbildes',desc:'Wir formulieren ein gemeinsames, realistisches, aber mutiges Bild davon, wie Lernen in unserer Schule in 3–5 Jahren mit digitalen Medien aussieht.',qs:['Wie sieht ein gelungener Lerntag mit digitalen Medien für unsere Schüler:innen konkret aus?','Welche Rolle spielen Beziehung, Struktur und Sicherheit?','Wer muss an der Entwicklung beteiligt sein?']},
{id:'EF1-2',cat:0,title:'Gemeinsame Prozessgestaltung',desc:'Digitalisierung ist Teil der gesamten Schulentwicklung.',qs:['Welche Gremien können Verantwortung übernehmen?','Wie werden skeptische Kolleg:innen gehört?','Was brauchen wir für verbindliche Entscheidungen?']},
{id:'EF2-1',cat:1,title:'Digitale Lebenswelten unserer Schüler:innen verstehen',desc:'Wir knüpfen an digitale Erfahrungen, Interessen und Lernvoraussetzungen an.',qs:['Welche Geräte, Apps und Spiele nutzen unsere Schüler:innen?','Welche Chancen und Risiken sehen wir?','Wie greifen wir die digitale Lebenswelt pädagogisch auf?']},
{id:'EF2-2',cat:1,title:'Partizipation durch (Mit-)Verantwortung stärken',desc:'Digitale Medien helfen, Selbstwirksamkeit und Teilhabe zu ermöglichen.',qs:['Wo können Tablets, Talker oder Symbolsysteme unterstützen?','Wie können Schüler:innen Lernprodukte präsentieren?','Wer profitiert besonders von assistiven Technologien?']},
{id:'EF3-1',cat:2,title:'Stärkung der Beziehungsarbeit',desc:'Digitale Medien unterstützen die Beziehungsarbeit – sie ersetzen sie nicht.',qs:['Wann stärken digitale Medien Beziehungen?','Wo könnte Technik die direkte Beziehung schwächen?','Wie können digitale Routinen Zugehörigkeit fördern?']},
{id:'EF3-2',cat:2,title:'Differenzierung und Individualisierung erleichtern',desc:'Digitale Tools helfen, Lernangebote an unterschiedliche Leistungsstände anzupassen.',qs:['Welche Apps unterstützen individuelle Aufgaben?','Wie machen wir Lernstände sichtbar?','Wo können digitale Tools Lehrkräfte entlasten?']},
{id:'EF4-1',cat:3,title:'Einbezug von Expertisen und Perspektiven',desc:'Die gesamte Schulgemeinschaft wird einbezogen.',qs:['Welche Perspektiven berücksichtigen wir bereits?','Wo fehlen Stimmen?','Wie wird Beteiligung kontinuierlich gestaltet?']},
{id:'EF4-2',cat:3,title:'Erweiterte Haltungen und Mindsets',desc:'Wir entwickeln Offenheit, Lernbereitschaft und Reflexion weiter.',qs:['Wie gehen wir mit Unsicherheit und Überforderung um?','Welche Grundüberzeugungen möchten wir entwickeln?','Wie schaffen wir Räume für Austausch?']},
{id:'EF5-1',cat:4,title:'Einsatz digitaler Lehr-Lernsoftware',desc:'Wir setzen Software bewusst, zielgerichtet und datenschutzkonform ein.',qs:['Welche Software nutzen wir und mit welchem Ziel?','Wie prüfen wir neue Angebote?','Wie sichern wir die Anwendungskompetenz?']},
{id:'EF5-2',cat:4,title:'Effektiver Einsatz schulischer Lehr-Lerngeräte',desc:'Unsere Geräte sind gut zugänglich und verlässlich nutzbar.',qs:['Welche Geräte stehen zur Verfügung?','Wo liegen technische Hürden?','Welche Anschaffungen haben Priorität?']}
];
const buttonLabels={right:'An diesem Thema arbeiten wir aktuell',left:'An diesem Thema haben wir bereits erarbeitet',down:'Dieses Thema ist aktuell für uns nicht relevant',up:'An diesem Thema möchten wir zukünftig arbeiten'};
const groupLabels={aktuell:'An diesen Themen arbeiten wir aktuell',erarbeitet:'Diese Themen haben wir bereits erarbeitet',nichtRelevant:'Diese Themen sind aktuell für uns nicht relevant',zukuenftig:'An diesen Themen möchten wir zukünftig arbeiten'};
let state={screen:'start',cat:0,index:0,assignments:{},quick:'',roadmap:'',priority:[],excluded:[],swipeHistory:[]};const app=document.getElementById('app');
function reset(){state={screen:'start',cat:0,index:0,assignments:{},quick:'',roadmap:'',priority:[],excluded:[],swipeHistory:[]};render()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function saveNotes(){state.quick=document.getElementById('quick')?.value??state.quick;state.roadmap=document.getElementById('roadmap')?.value??state.roadmap}function render(){if(state.screen==='start')startView();else if(state.screen==='categories')categoriesView();else if(state.screen==='swipe')swipeView();else if(state.screen==='results')resultsView();else notesView()}
function startView(){app.innerHTML='<section class="hero"><div class="eyebrow">Swipe-Testversion</div><h1>Digitale Transformation gemeinsam gestalten.</h1><p>Wischen Sie Karten nach rechts oder links. Die übrigen Sortierungen erreichen Sie über die Aktionsbuttons.</p><div class="actions"><button id="start" class="button">Beratung starten</button></div><div class="panel notice">Kein Login, kein Server und keine dauerhafte Speicherung. Diese Testversion enthält dieselben Prozessschritte wie die Kartenansicht.</div></section>';document.getElementById('start').onclick=()=>{state.screen='categories';render()}}
function categoriesView(){app.innerHTML='<div class="eyebrow">Schritt 1 von 4</div><h1>Oberkategorie auswählen</h1><p class="muted">Die Karten einer Kategorie werden nacheinander als Swipe-Karten angezeigt.</p><div class="grid">'+categories.map((c,i)=>'<button class="panel category" data-cat="'+i+'"><span class="number">0'+(i+1)+'</span><h3>'+c+'</h3><span class="muted">'+cards.filter(x=>x.cat===i).length+' Beispielkarten · '+cards.filter(x=>x.cat===i&&state.assignments[x.id]).length+' sortiert</span></button>').join('')+'</div><div class="footer"><button class="button secondary" id="home">Zur Startseite – Sitzung zurücksetzen</button><div class="actions" style="margin-top:0"><button class="button secondary" id="results">Ergebnisübersicht</button><button class="button" id="all">Alle Karten starten</button></div></div>';document.getElementById('home').onclick=reset;document.getElementById('all').onclick=()=>{state.cat=0;state.index=0;state.screen='swipe';render()};document.getElementById('results').onclick=()=>{state.screen='results';render()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=+b.dataset.cat;state.index=0;state.screen='swipe';render()})}
function currentCard(){return cards.filter(c=>c.cat===state.cat)[state.index]}
function swipeView(){const list=cards.filter(c=>c.cat===state.cat),c=currentCard();app.innerHTML='<div class="eyebrow">'+categories[state.cat]+'</div><div class="progress"><span style="width:'+((state.index+1)/list.length*100)+'%"></span></div><div class="swipe-stage"><section id="swipeCard" class="panel swipe-card"><div class="swipe-label left">BEREITS ERARBEITET</div><div class="swipe-label right">AKTUELL</div><div><div class="code">'+c.id+' · Karte '+(state.index+1)+' von '+list.length+'</div><h2>'+c.title+'</h2><p>'+c.desc+'</p><details class="questions"><summary>Impulsfragen anzeigen</summary><ul>'+c.qs.map(q=>'<li>'+q+'</li>').join('')+'</ul></details></div><div><div class="sort-help"><div class="help left">← Nach links: bereits erarbeitet</div><div class="help right">Nach rechts: aktuell →</div><div class="help left">↓ Button: aktuell nicht relevant</div><div class="help right">↑ Button: zukünftig</div></div><div class="swipe-actions"><button class="round left" id="left" title="Bereits erarbeitet">←</button><button class="round neutral" id="down" title="Nicht relevant">↓</button><button class="round neutral" id="up" title="Zukünftig">↑</button><button class="round right" id="right" title="Aktuell">→</button></div></div></section></div><div class="footer"><button class="button secondary" id="back">Zurück</button><button class="button secondary" id="cats">Oberkategorien</button></div>';['left','right','up','down'].forEach(dir=>document.getElementById(dir).onclick=()=>decide(dir));enableTouch()}
function decide(dir){const c=currentCard();const map={right:'aktuell',left:'erarbeitet',down:'nichtRelevant',up:'zukuenftig'};state.assignments[c.id]=map[dir];state.swipeHistory.push({id:c.id,dir});const el=document.getElementById('swipeCard');el.classList.add(dir==='left'?'fly-left':'fly-right');setTimeout(()=>{const list=cards.filter(x=>x.cat===state.cat);if(state.index<list.length-1)state.index++;else state.screen='categories';render()},180)}
function enableTouch(){const el=document.getElementById('swipeCard');let startX=0,startY=0,dx=0,drag=false;el.addEventListener('pointerdown',e=>{if(e.target.closest('details'))return;drag=true;startX=e.clientX;startY=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-startX;const dy=e.clientY-startY;el.style.transform='translate('+dx+'px,'+(dy*.12)+'px) rotate('+(dx*.05)+'deg)';el.classList.toggle('left',dx<-35);el.classList.toggle('right',dx>35)});el.addEventListener('pointerup',()=>{if(!drag)return;drag=false;el.classList.remove('dragging','left','right');el.style.transform='';if(Math.abs(dx)>100)decide(dx>0?'right':'left');dx=0})}
function grouped(){return Object.keys(groupLabels).map(k=>[k,cards.filter(c=>state.assignments[c.id]===k)])}function resultItems(a){return a.length?a.map(c=>'<div class="result"><span class="code">'+c.id+'</span> '+c.title+'<details><summary>Impulsfragen anzeigen</summary><ul>'+c.qs.map(q=>'<li>'+q+'</li>').join('')+'</ul></details></div>').join(''):'<p class="muted">Noch keine Karten in dieser Gruppe.</p>'}function focusCards(){return cards.filter(c=>['aktuell','zukuenftig'].includes(state.assignments[c.id]))}
function priorityCard(c,i){return '<div class="drag-card" draggable="true" data-drag="'+c.id+'"><span class="rank">'+(i+1)+'</span><strong>'+c.title+'</strong><small>'+c.id+' · '+groupLabels[state.assignments[c.id]]+'</small></div>'}function priorityBoard(){const focus=focusCards(),inc=state.priority.map(id=>cards.find(c=>c.id===id)).filter(Boolean);focus.forEach(c=>{if(!state.priority.includes(c.id)&&!state.excluded.includes(c.id))inc.push(c)});const exc=state.excluded.map(id=>cards.find(c=>c.id===id)).filter(Boolean);return '<div class="priority-layout"><div class="dropzone" data-zone="include"><h3>Schwerpunkte für Quick Wins und Fahrplan</h3><p class="muted">Oben = höhere Gewichtung.</p>'+(inc.length?inc.map((c,i)=>priorityCard(c,i)).join(''):'<p class="muted">Noch keine Schwerpunkte.</p>')+'</div><div class="dropzone exclude" data-zone="exclude"><h3>Nicht berücksichtigen</h3><p class="muted">Hierher ziehen, wenn ein Thema nicht in Schritt 3 erscheinen soll.</p>'+(exc.length?exc.map((c,i)=>priorityCard(c,i)).join(''):'<p class="muted">Noch keine ausgeschlossenen Schwerpunkte.</p>')+'</div></div>'}
function setupDrag(){document.querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));document.querySelectorAll('.dropzone').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain');state.priority=state.priority.filter(x=>x!==id);state.excluded=state.excluded.filter(x=>x!==id);(z.dataset.zone==='include'?state.priority:state.excluded).push(id);render()}})}
function resultsView(){const current=cards.filter(c=>state.assignments[c.id]==='aktuell'),future=cards.filter(c=>state.assignments[c.id]==='zukuenftig');app.innerHTML='<div class="eyebrow">Schritt 2 von 4</div><h1>Ergebnisübersicht</h1><p class="muted">'+Object.keys(state.assignments).length+' von '+cards.length+' Karten sortiert.</p>'+grouped().map(([k,a])=>'<section class="result-section"><h3>'+groupLabels[k]+' <span class="count">'+a.length+'</span></h3>'+resultItems(a)+'</section>').join('')+'<section class="panel highlight"><h2>Zusammenfassung der Schwerpunkte</h2><p class="muted">Gewichten Sie aktuelle und zukünftige Themen per Drag-and-drop.</p>'+priorityBoard()+'</section><div class="footer"><button class="button secondary" id="step1">Zurück zu Schritt 1</button><button class="button secondary" id="home">Zur Startseite – Sitzung zurücksetzen</button><button class="button" id="continue">Quick Wins und Fahrplan</button></div>';setupDrag();document.getElementById('step1').onclick=()=>{state.screen='categories';render()};document.getElementById('home').onclick=reset;document.getElementById('continue').onclick=()=>{state.screen='notes';render()}}
function notesView(){const focus=focusCards(),inc=state.priority.map(id=>cards.find(c=>c.id===id)).filter(Boolean).concat(focus.filter(c=>!state.priority.includes(c.id)&&!state.excluded.includes(c.id))),exc=state.excluded.map(id=>cards.find(c=>c.id===id)).filter(Boolean);app.innerHTML='<div class="eyebrow">Schritt 3 von 4</div><h1>Quick Wins und Fahrplan</h1><section class="panel"><h2>Gewichtete Schwerpunkte</h2><p class="muted">Die Reihenfolge entspricht der Gewichtung aus Schritt 2.</p>'+(inc.length?'<ol class="priority-list">'+inc.map((c,i)=>'<li><span class="rank">'+(i+1)+'</span><strong>'+c.title+'</strong><br><small class="muted">'+c.id+' · '+groupLabels[state.assignments[c.id]]+'</small><details><summary>Impulsfragen anzeigen</summary><ul class="question-list">'+c.qs.map(q=>'<li>'+q+'</li>').join('')+'</ul></details></li>').join('')+'</ol>':'<p class="muted">Keine berücksichtigten Schwerpunkte.</p>')+(exc.length?'<h3>Nicht berücksichtigt</h3>'+exc.map(c=>'<div class="result"><span class="code">'+c.id+'</span> '+c.title+'</div>').join(''):'')+'</section><div class="forms"><section class="panel"><label for="quick">Quick Wins</label><textarea id="quick" placeholder="Welche kleinen Schritte können kurzfristig umgesetzt werden?">'+esc(state.quick)+'</textarea></section><section class="panel"><label for="roadmap">Fahrplan für die nächsten zwei Jahre</label><textarea id="roadmap" placeholder="Welche 3–5 Schwerpunkte setzen wir sich?">'+esc(state.roadmap)+'</textarea></section></div><div class="export-note">Der Export öffnet den Druckdialog Ihres Browsers. Dort können Sie „Als PDF speichern“ auswählen.</div><div class="footer"><button class="button secondary" id="results">Zur Ergebnisübersicht</button><button class="button" id="print">Druck- / PDF-Export</button></div>';document.getElementById('results').onclick=()=>{saveNotes();state.screen='results';render()};document.getElementById('print').onclick=()=>{saveNotes();window.print()}}
render();})();
</script></body></html>
