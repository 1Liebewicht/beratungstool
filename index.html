<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beratungstool – Digitale Transformation an Förderschulen</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;line-height:1.5;--primary:#5664d8;--ink:#172033;--muted:#687181;--line:#e1e6ef;--panel:#fff;--focus:#ffbf47}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{border:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 24px;font-weight:750}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center}.top-actions{display:flex;gap:8px;align-items:center}.container{max-width:1080px;margin:auto;padding:30px 20px 70px}.hero{text-align:center;max-width:800px;margin:36px auto}.eyebrow{color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:14px 0}.hero p,.muted{color:var(--muted)}.hero-copy{font-size:1.06rem;max-width:720px;margin:0 auto 12px;line-height:1.65}.button{border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--ink);color:#fff;font-weight:750;min-height:44px}.button:hover{filter:brightness(1.08)}.button.secondary{background:#eef1f7;color:#24304a}.button.ghost{background:transparent;color:#394565;border:1px solid var(--line)}button:focus-visible,textarea:focus-visible,.category:focus-visible,.swipe-card:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.actions,.footer{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:25px}.actions{justify-content:center}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 12px 35px #365c0d0d}.notice{margin-top:22px;color:#3d4b8d;background:#f1f4ff;border-radius:14px;padding:16px;text-align:left}.notice strong{display:block;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.category{text-align:left;min-height:170px;cursor:pointer}.category:hover{border-color:var(--primary);transform:translateY(-2px)}.category h3{margin:10px 0 4px}.number,.code{color:var(--primary);font-weight:800}.progress{height:8px;background:#e7eaf1;border-radius:99px;margin:18px 0 24px;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}.swipe-stage{max-width:650px;margin:0 auto}.swipe-card{position:relative;min-height:455px;padding:30px 26px;display:flex;flex-direction:column;justify-content:space-between;touch-action:none;user-select:none;cursor:grab;transition:transform .22s ease,opacity .22s ease}.swipe-card.dragging{cursor:grabbing;transition:none}.swipe-card.fly-left{transform:translateX(-130%) rotate(-18deg);opacity:0}.swipe-card.fly-right{transform:translateX(130%) rotate(18deg);opacity:0}.swipe-label{position:absolute;top:30px;padding:7px 12px;border:3px solid;border-radius:9px;font-weight:800;opacity:0;transition:opacity .1s}.swipe-label.left{left:25px;color:#a32626;border-color:#a32626}.swipe-label.right{right:25px;color:#176b37;border-color:#176b37}.swipe-card.left .swipe-label.left,.swipe-card.right .swipe-label.right{opacity:1}.swipe-card h2{font-size:clamp(1.55rem,4vw,2.6rem);line-height:1.12;margin:15px 0}.questions{margin:20px 0;border-top:1px solid var(--line);padding-top:15px}.questions summary,.result summary,.sorted-cards summary{cursor:pointer;font-weight:700}.questions li,.question-list li{margin:9px 0}.swipe-help{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.help{padding:14px;border-radius:12px;font-weight:700;text-align:center}.help.left{background:#fff0f0;color:#8b2727}.help.right{background:#eef9f1;color:#176b37}.result{background:#f7f8fb;border-radius:10px;padding:11px;margin:7px 0}.result details{margin-top:10px;border-top:1px solid #e1e5ed;padding-top:9px}.count{background:#eef1f7;border-radius:99px;padding:4px 10px;font-size:.85rem}.result-section{margin:28px 0}.sorted-cards{margin:18px 0 24px}.sorted-cards>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;color:#24304a}.sorted-cards[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}.sorted-cards-content{padding:2px 20px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:#fff}.highlight{border-left:5px solid var(--primary)}.forms{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.textarea-wrap{display:block}.textarea-wrap label{font-weight:750;display:block;margin-bottom:8px}textarea{width:100%;min-height:190px;border:1px solid #d9deea;border-radius:14px;padding:14px;resize:vertical;background:#fff}.export-note{padding:14px;background:#f0faf3;border-radius:12px;color:#176b37;margin-top:18px}.priority-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.dropzone{min-height:140px;border:2px dashed #cbd2e1;border-radius:16px;padding:15px;background:#fafbfe}.dropzone.exclude{background:#fff8f5;border-color:#e8c9bc}.dropzone.over{background:#eef4ff;border-color:var(--primary)}.drag-card{background:#fff;border:1px solid #dfe4ed;border-radius:12px;padding:12px;margin:8px 0;cursor:grab}.rank{display:inline-flex;width:27px;height:27px;border-radius:50%;background:#eef1f7;align-items:center;justify-content:center;margin-right:8px;font-size:.85rem;font-weight:700}.session-status{font-size:.86rem;color:var(--muted)}@media(max-width:700px){.topbar{padding:10px 15px}.brand-text{display:none}.container{padding:25px 15px 60px}.forms,.priority-layout{grid-template-columns:1fr}.swipe-card{min-height:500px;padding:26px 20px}.swipe-help{grid-template-columns:1fr}.footer .button,.actions .button{flex:1}.panel{padding:20px}}@media print{.topbar,.no-print{display:none!important}.container{padding:0;max-width:none}.panel{box-shadow:none;border:0;padding:0}.forms{display:block}.textarea-wrap{margin-top:25px}textarea{border:1px solid #999}.sorted-cards{display:block!important}.sorted-cards-content{display:block!important;border:0;padding:0}.sorted-cards>summary{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">↔</span><span class="brand-text">Beratungstool</span></div><div class="top-actions"><span id="sessionStatus" class="session-status">Lokale Sitzung</span><button id="resetTop" class="button ghost no-print" type="button">Zurücksetzen</button></div></header>
<main id="app" class="container" aria-live="polite"></main>
<script>
'use strict';
const categories=['Schulisches Zukunftsbild','Persönlichkeitsentwicklung und Lebenswelt der Schülerinnen','Gestaltung schulischer Lehr-Lernprozesse','Veränderte Rollen und kontinuierliche Professionalisierung von Lehrkräften','Einbezug digitaler Ausstattung'];
const cards=[
{id:'EF1-1',cat:0,title:'Partizipative Entwicklung unseres Zukunftsbildes',desc:'Wir formulieren ein gemeinsames, realistisches, aber mutiges Bild davon, wie Lernen an unserer Schule in fünf Jahren mit digitalen Medien aussieht.',qs:['Wie sieht ein gelungener Lerntag mit digitalen Medien für unsere Schülerinnen konkret aus?','Welche Rolle spielen Beziehung, Struktur und Sicherheit?','Wer muss an der Entwicklung beteiligt sein?']},
{id:'EF1-2',cat:0,title:'Gemeinsame Prozessgestaltung',desc:'Digitalisierung ist Teil der gesamten Schulentwicklung.',qs:['Welche Gremien können Verantwortung übernehmen?','Wie werden skeptische Kolleginnen und Kollegen gehört?','Was brauchen wir für verbindliche Entscheidungen?']},
{id:'EF2-1',cat:1,title:'Digitale Lebenswelten unserer Schülerinnen verstehen',desc:'Wir knüpfen an digitale Erfahrungen, Interessen und Lernvoraussetzungen an.',qs:['Welche Geräte, Apps und Spiele nutzen unsere Schülerinnen?','Welche Chancen und Risiken sehen wir?','Wie greifen wir die digitale Lebenswelt pädagogisch auf?']},
{id:'EF2-2',cat:1,title:'Partizipation durch Mitverantwortung stärken',desc:'Digitale Medien helfen, Selbstwirksamkeit und Teilhabe zu ermöglichen.',qs:['Wo können Tablets, Talker oder Symbolsysteme unterstützen?','Wie können Schülerinnen Lernprodukte präsentieren?','Wer profitiert besonders von assistiven Technologien?']},
{id:'EF3-1',cat:2,title:'Stärkung der Beziehungsarbeit',desc:'Digitale Medien unterstützen die Beziehungsarbeit – sie ersetzen sie nicht.',qs:['Wann stärken digitale Medien Beziehungen?','Wo könnte Technik die direkte Beziehung schwächen?','Wie können digitale Routinen Zugehörigkeit fördern?']},
{id:'EF3-2',cat:2,title:'Differenzierung und Individualisierung erleichtern',desc:'Digitale Tools helfen, Lernangebote an unterschiedliche Leistungsstände anzupassen.',qs:['Welche Apps unterstützen individuelle Aufgaben?','Wie machen wir Lernstände sichtbar?','Wo können digitale Tools Lehrkräfte entlasten?']},
{id:'EF4-1',cat:3,title:'Einbezug von Expertisen und Perspektiven',desc:'Die gesamte Schulgemeinschaft wird einbezogen.',qs:['Welche Perspektiven berücksichtigen wir bereits?','Wo fehlen Stimmen?','Wie wird Beteiligung kontinuierlich gestaltet?']},
{id:'EF4-2',cat:3,title:'Erweiterte Haltungen und Mindsets',desc:'Wir entwickeln Offenheit, Lernbereitschaft und Reflexion weiter.',qs:['Wie gehen wir mit Unsicherheit und Überforderung um?','Welche Grundüberzeugungen möchten wir entwickeln?','Wie schaffen wir Räume für Austausch?']},
{id:'EF5-1',cat:4,title:'Einsatz digitaler Lehr-Lernsoftware',desc:'Wir setzen Software bewusst, zielgerichtet und datenschutzkonform ein.',qs:['Welche Software nutzen wir und mit welchem Ziel?','Wie prüfen wir neue Angebote?','Wie sichern wir die Anwendungskompetenz?']},
{id:'EF5-2',cat:4,title:'Effektiver Einsatz schulischer Lehr-Lerngeräte',desc:'Unsere Geräte sind gut zugänglich und verlässlich nutzbar.',qs:['Welche Geräte stehen zur Verfügung?','Wo liegen technische Hürden?','Welche Anschaffungen haben Priorität?']}
];
const KEY='beratungstool-v2';let state=load()||{screen:'start',cat:0,index:0,assignments:{},priority:[],excluded:[],quick:'',roadmap:''};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function saveNotes(){state.quick=document.getElementById('quick')?.value??state.quick;state.roadmap=document.getElementById('roadmap')?.value??state.roadmap;persist()}function setScreen(screen){saveNotes();state.screen=screen;render()}function reset(){localStorage.removeItem(KEY);state={screen:'start',cat:0,index:0,assignments:{},priority:[],excluded:[],quick:'',roadmap:''};render()}function cardList(){return cards.filter(c=>c.cat===state.cat)}function current(){return cardList()[state.index]}
function render(){if(state.screen==='start')startView();else if(state.screen==='categories')categoriesView();else if(state.screen==='swipe')swipeView();else if(state.screen==='results')resultsView();else notesView();document.getElementById('sessionStatus').textContent=Object.keys(state.assignments).length?`${Object.keys(state.assignments).length}/${cards.length} Karten sortiert`:'Lokale Sitzung'}
function startView(){document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Moderierter Workshop</div><h1>Digitale Transformation an Förderschulen gemeinsam gestalten</h1><p class="hero-copy">Dieses Beratungstool unterstützt Medienberatende dabei, Themen der digitalen Schulentwicklung strukturiert zu besprechen und gemeinsam mit einer Schule Schwerpunkte zu setzen.</p><p class="hero-copy">Sie ordnen Themenkarten zwei Bereichen zu, gewichten die Arbeitsschwerpunkte und halten konkrete nächste Schritte fest.</p><div class="notice"><strong>Datenschutz-Hinweis</strong>Ihre Eingaben bleiben in dieser Sitzung auf diesem Gerät. Es gibt keinen Login und keine automatische Übertragung. Nutzen Sie den Druckdialog, um die Ergebnisse als PDF zu sichern.</div><div class="actions"><button id="start" class="button" type="button">Beratung starten</button><button id="continueBtn" class="button secondary" type="button" ${Object.keys(state.assignments).length?'':'disabled'}>Sitzung fortsetzen</button></div></section>`;document.getElementById('start').onclick=()=>setScreen('categories');document.getElementById('continueBtn').onclick=()=>setScreen('results')}
function categoriesView(){document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 1 von 4</div><h1>Entwicklungsbereich auswählen</h1><p class="muted">Wählen Sie einen Bereich. Die Karten werden nacheinander angezeigt; bereits sortierte Karten bleiben erhalten.</p><div class="grid">${categories.map((c,i)=>{const n=cards.filter(x=>x.cat===i).length,done=cards.filter(x=>x.cat===i&&state.assignments[x.id]).length;return `<button class="panel category" data-cat="${i}" type="button"><span class="number">0${i+1}</span><h3>${esc(c)}</h3><span class="muted">${done} von ${n} Karten sortiert</span></button>`}).join('')}</div><div class="footer no-print"><button class="button secondary" id="home" type="button">Startseite</button><div class="actions"><button class="button secondary" id="results" type="button">Ergebnisübersicht</button><button class="button" id="all" type="button">Alle offenen Karten starten</button></div></div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=+b.dataset.cat;state.index=0;while(state.index<cardList().length&&state.assignments[cardList()[state.index].id])state.index++;setScreen('swipe')});document.getElementById('home').onclick=()=>setScreen('start');document.getElementById('results').onclick=()=>setScreen('results');document.getElementById('all').onclick=()=>{state.cat=0;state.index=0;while(state.index<cardList().length&&state.assignments[cardList()[state.index].id])state.index++;setScreen('swipe')}}
function decide(dir){const c=current();if(!c)return;state.assignments[c.id]=dir;persist();const list=cardList(),el=document.getElementById('swipeCard');el.classList.add(dir==='left'?'fly-left':'fly-right');setTimeout(()=>{if(state.index<list.length-1)state.index++;else state.screen='categories';render()},220)}
function swipeView(){const list=cardList(),c=current();if(!c){state.screen='categories';return render()}const done=Object.keys(state.assignments).filter(id=>cards.find(x=>x.id===id)?.cat===state.cat).length;document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 2 von 4 · ${esc(categories[state.cat])}</div><h1>Themenkarten sortieren</h1><p class="muted">Karte ${state.index+1} von ${list.length} · ${done} bereits sortiert</p><div class="panel notice"><strong>So funktioniert das Sortieren</strong><span>Wischen oder ziehen Sie nach links für „bereits erarbeitet / aktuell nicht relevant“ und nach rechts für „aktueller / zukünftiger Arbeitsschwerpunkt“. Tastatur: ← oder →.</span></div><div class="progress" aria-label="Fortschritt"><span style="width:${((state.index+1)/list.length)*100}%"></span></div><section class="swipe-stage"><div id="swipeCard" class="panel swipe-card" tabindex="0" role="group" aria-label="Themenkarte"><div class="swipe-label left">BEREITS ERARBEITET</div><div class="swipe-label right">ARBEITSSCHWERPUNKT</div><div><span class="code">${esc(c.id)}</span><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p><details class="questions"><summary>Impulsfragen anzeigen</summary><ul>${c.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details></div><div class="swipe-help"><div class="help left">← Bereits erarbeitet<br><small>oder nicht relevant</small></div><div class="help right">Aktueller / zukünftiger<br>Arbeitsschwerpunkt →</div></div></div></section><div class="footer no-print"><button class="button secondary" id="back" type="button">Zurück</button><button class="button secondary" id="cats" type="button">Bereiche</button><button class="button" id="skip" type="button">Später entscheiden</button></div>`;const el=document.getElementById('swipeCard');let sx=0,dx=0,drag=false;function move(x){dx=x-sx;el.style.transform=`translateX(${dx}px) rotate(${dx*.05}deg)`;el.classList.toggle('left',dx<-35);el.classList.toggle('right',dx>35)}function end(){if(!drag)return;drag=false;el.classList.remove('dragging','left','right');el.style.transform='';if(Math.abs(dx)>100)decide(dx>0?'right':'left');else dx=0}el.addEventListener('pointerdown',e=>{if(e.target.closest('details'))return;drag=true;sx=e.clientX;el.setPointerCapture(e.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(drag)move(e.clientX)});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();decide('left')}if(e.key==='ArrowRight'){e.preventDefault();decide('right')}});document.getElementById('back').onclick=()=>{if(state.index>0){state.index--;setScreen('swipe')}else setScreen('categories')};document.getElementById('cats').onclick=()=>setScreen('categories');document.getElementById('skip').onclick=()=>{if(state.index<list.length-1){state.index++;render()}else setScreen('categories')}}
function grouped(){return categories.map((label,cat)=>({label,items:cards.filter(c=>c.cat===cat&&state.assignments[c.id])})).filter(g=>g.items.length)}function item(c){return `<div class="result"><span class="code">${esc(c.id)}</span> ${esc(c.title)}<details><summary>Impulsfragen anzeigen</summary><ul>${c.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details></div>`}function focus(){return cards.filter(c=>state.assignments[c.id]==='right')}function priorityCard(c,i){return `<div class="drag-card" draggable="true" data-drag="${c.id}"><span class="rank">${i+1}</span><strong>${esc(c.title)}</strong><br><small class="muted">${esc(c.id)}</small></div>`}
function priorityBoard(){let inc=state.priority.map(id=>cards.find(c=>c.id===id)).filter(Boolean),exc=state.excluded.map(id=>cards.find(c=>c.id===id)).filter(Boolean),available=focus().filter(c=>!state.priority.includes(c.id)&&!state.excluded.includes(c.id));inc=[...inc,...available];state.priority=inc.map(c=>c.id);return `<div class="priority-layout"><div class="dropzone" data-zone="include"><h3>Schwerpunkte für Quick Wins und Fahrplan</h3><p class="muted">Oben = höhere Gewichtung. Ziehen Sie Karten, um zu sortieren.</p>${inc.length?inc.map(priorityCard).join(''):'<p class="muted">Noch keine Schwerpunkte.</p>'}</div><div class="dropzone exclude" data-zone="exclude"><h3>Nicht berücksichtigen</h3><p class="muted">Hierher ziehen, wenn ein Thema vorerst nicht weiterbearbeitet wird.</p>${exc.length?exc.map(priorityCard).join(''):'<p class="muted">Noch keine ausgeschlossenen Themen.</p>'}</div></div>`}
function setupDrag(){document.querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));document.querySelectorAll('.dropzone').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain');state.priority=state.priority.filter(x=>x!==id);state.excluded=state.excluded.filter(x=>x!==id);(z.dataset.zone==='include'?state.priority:state.excluded).push(id);persist();render()}})}
function resultsView(){const sorted=grouped();document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 3 von 4</div><h1>Ergebnisübersicht</h1><p class="muted">${Object.keys(state.assignments).length} von ${cards.length} Karten sortiert. Die Detailübersicht kann bei Bedarf aufgeklappt werden.</p><section class="panel highlight"><h2>Schwerpunkte gewichten</h2><p class="muted">Die Reihenfolge bestimmt die Priorität für die nächsten Schritte.</p>${priorityBoard()}</section><details class="sorted-cards"><summary>Sortierte Karten ansehen <span class="count">${Object.keys(state.assignments).length}</span></summary><div class="sorted-cards-content">${sorted.length?sorted.map(g=>`<section class="result-section"><h3>${esc(g.label)} <span class="count">${g.items.length}</span></h3>${g.items.map(item).join('')}</section>`).join(''):'<p class="muted">Noch keine Karten sortiert.</p>'}</div></details><div class="footer no-print"><button class="button secondary" id="step1" type="button">Zu Schritt 1</button><button class="button secondary" id="home" type="button">Startseite</button><button class="button" id="continueBtn" type="button">Quick Wins und Fahrplan</button></div>`;setupDrag();document.getElementById('step1').onclick=()=>setScreen('categories');document.getElementById('home').onclick=()=>setScreen('start');document.getElementById('continueBtn').onclick=()=>setScreen('notes')}
function notesView(){const inc=state.priority.map(id=>cards.find(c=>c.id===id)).filter(Boolean),exc=state.excluded.map(id=>cards.find(c=>c.id===id)).filter(Boolean);document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 4 von 4</div><h1>Quick Wins und Fahrplan</h1><section class="panel"><h2>Gewichtete Arbeitsschwerpunkte</h2><p class="muted">Die Reihenfolge entspricht der Gewichtung aus der Ergebnisübersicht.</p>${inc.length?`<ol>${inc.map(c=>`<li><strong>${esc(c.title)}</strong><br><small class="muted">${esc(c.id)}</small><details><summary>Impulsfragen anzeigen</summary><ul>${c.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details></li>`).join('')}</ol>`:'<p class="muted">Keine Arbeitsschwerpunkte berücksichtigt.</p>'}${exc.length?`<h3>Nicht berücksichtigt</h3>${exc.map(c=>`<div class="result"><span class="code">${esc(c.id)}</span> ${esc(c.title)}</div>`).join('')}`:''}</section><div class="forms"><section class="panel textarea-wrap"><label for="quick">Quick Wins</label><p class="muted">Welche kleinen Schritte können kurzfristig umgesetzt werden?</p><textarea id="quick" placeholder="Beispiel: Bis zum nächsten Treffen einen datenschutzkonformen Tool-Test mit einer Lerngruppe durchführen.">${esc(state.quick)}</textarea></section><section class="panel textarea-wrap"><label for="roadmap">Fahrplan für die nächsten zwei Jahre</label><p class="muted">Welche drei bis fünf Schwerpunkte setzen wir – mit Verantwortlichen und Termin?</p><textarea id="roadmap" placeholder="Schwerpunkt 1 – Verantwortlich – Termin&#10;Schwerpunkt 2 – Verantwortlich – Termin">${esc(state.roadmap)}</textarea></section></div><div class="export-note">Der Export öffnet den Druckdialog Ihres Browsers. Wählen Sie dort „Als PDF speichern“.</div><div class="footer no-print"><button class="button secondary" id="results" type="button">Zur Ergebnisübersicht</button><button class="button" id="print" type="button">Drucken / PDF-Export</button></div>`;document.getElementById('results').onclick=()=>setScreen('results');document.getElementById('print').onclick=()=>{saveNotes();window.print()}}
document.getElementById('resetTop').onclick=()=>{if(confirm('Die gesamte lokale Sitzung wirklich zurücksetzen?'))reset()};render();
</script>
</body>
</html>
